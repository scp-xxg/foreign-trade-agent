# Modified by foreign-trade-agent contributors, 2026-10-21; see CHANGES_FOREIGN_TRADE.md.
# The foreign-trade web demo needs no model credentials or running backend for CI.
# Dependency downloads are the only network requirement; quote tests run offline.
name: Foreign Trade CI

on:
  push:
    branches: [main]
    paths:
      - "extensions/foreign_trade/**"
      - "packages/**"
      - "tests/**"
      - "tests/test_foreign_trade*.py"
      - "src/frontend/**"
      - "src/backend/**"
      - "tests/test_inquiry*.py"
      - "tests/test_buyer_public_data.py"
      - "tests/test_product_content*.py"
      - "tests/test_trade*.py"
      - "tests/test_tool_result_identity.py"
      - "tests/test_compaction_failure*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/foreign-trade-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/foreign_trade/**"
      - "packages/**"
      - "tests/**"
      - "tests/test_foreign_trade*.py"
      - "src/frontend/**"
      - "src/backend/**"
      - "tests/test_inquiry*.py"
      - "tests/test_buyer_public_data.py"
      - "tests/test_product_content*.py"
      - "tests/test_trade*.py"
      - "tests/test_tool_result_identity.py"
      - "tests/test_compaction_failure*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/foreign-trade-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foreign-trade-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inquiry-api:
    name: Three trade workflows, migration, evidence safety and native tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUGAGENT_SKIP_ENV_FILES: "1"
      MEM0_ENABLED: "false"
      PYTHONPATH: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install public backend and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pip install --no-deps -e .
      - name: Test owned inquiries and bounded public sources without live network
        run: |
          python -m pytest tests -q
          python -m pytest \
            src/backend/tests/llm/test_compaction_mid_turn.py src/backend/tests/llm/test_compaction_watermark.py \
            src/backend/tests/llm/test_compaction_e2e.py src/backend/tests/orchestration/test_model_steps_pipeline.py \
            src/backend/tests/orchestration/test_context_budget_stop.py \
            src/backend/tests/orchestration/test_user_question_passthrough.py src/backend/tests/orchestration/test_chat_run_cancel_persistence.py \
            src/backend/tests/test_plugin_progressive_loading.py src/backend/tests/llm/test_local_plugin_sticky_ids.py \
            src/backend/tests/llm/test_tool_call_response_ids.py src/backend/tests/llm/test_chat_model_text_content.py \
            src/backend/tests/llm/test_project_environment_factory.py src/backend/tests/llm/test_mcp_factory_e2e.py \
            src/backend/tests/llm/test_responses_stream_integrity.py \
            tests/test_image_attachment_context.py \
            src/backend/tests/llm/test_file_context_preview.py src/backend/tests/llm/test_file_context_offloads_blocking_parse.py \
            src/backend/tests/features/desktop/capabilities/test_trade_import_native_tools.py \
            src/backend/tests/features/knowledge/test_kb_wiki_pipeline.py \
            src/backend/tests/features/knowledge/test_kb_wiki_end_to_end.py \
            src/backend/tests/features/knowledge/test_kb_index_queue.py \
            src/backend/tests/features/knowledge/test_kb_document_status.py -q

  quote-and-web:
    name: Quote engine, bilingual exports, and CE web build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VITE_EDITION: ce
      VITE_DEFAULT_LANGUAGE: zh-CN
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The frontend export checks call <repo>/.venv/bin/python directly.
      # Only the standard library is needed; do not install backend or model SDKs.
      - name: Create the quote-test Python environment
        run: python -m venv --without-pip .venv

      - name: Test the deterministic quote engine
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_foreign_trade_engine.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_foreign_trade_quote*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund

      # prebuild produces local workspace packages required by SSR card tests.
      - name: Build the public CE web app
        working-directory: src/frontend
        run: npm run build

      - name: Test quote cards and bilingual document exports
        working-directory: src/frontend
        run: npm run test:foreign-trade-quote

      - name: Test structured content receipts and revision-bound downloads
        working-directory: src/frontend
        run: npm run test:foreign-trade-content-card

      - name: Test collaboration review and handoff download guards
        working-directory: src/frontend
        run: npm run test:foreign-trade-collaboration

      - name: Test sourced rule-review cards and immutable downloads
        working-directory: src/frontend
        run: npm run test:foreign-trade-review

      - name: Test language defaults, context limits, generation modes and record views
        working-directory: src/frontend
        run: |
          npm run test:default-language
          npm run test:model-context-length
          npm run test:foreign-trade-content-mode
          npm run test:foreign-trade-record-view
          npm run test:local-private-knowledge

      - name: Test attachment routing and non-vision image references
        working-directory: src/frontend
        run: |
          npm run test:attachment-routing
          npm run test:attachment-send

