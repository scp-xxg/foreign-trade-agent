<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/sailagent-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sailagent</title>
    <meta name="application-name" content="sailagent" />
    <meta name="description" content="sailagent · 外贸出海智能助手：买家核验、询盘报价、商品内容与岗位协同。Powered by HugAgentOS." />
    <link rel="apple-touch-icon" href="/brand/sailagent-icon-192.png" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <script>
      // 防闪烁：在任何 CSS/JS 加载前同步落主题，避免深色用户首屏闪白。
      // key 与解析规则和 src/theme.ts 保持一致（非 light/dark 的值一律按 system）；
      // 分享预览页锁定浅色。主树 src/frontend/index.html 有逐字相同的一份，三处同步改。
      ;(function () {
        try {
          var mode = localStorage.getItem('hugagent_theme_mode')
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              typeof matchMedia === 'function' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          if (new URLSearchParams(location.search).has('share')) dark = false
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* 存储被禁等异常时保持浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
